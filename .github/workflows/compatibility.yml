name: Linux compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-and-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check shell syntax
        run: bash -n install.sh install-online.sh scripts/distro-packages.sh kde/install.sh
      - name: Check engine patch series
        shell: bash
        run: |
          ref=$(sed -n 's/^ENGINE_REF="\([a-f0-9]*\)"/\1/p' install.sh)
          git init "$RUNNER_TEMP/engine"
          git -C "$RUNNER_TEMP/engine" fetch --depth=1 https://github.com/Almamu/linux-wallpaperengine.git "$ref"
          python scripts/check-engine-patches.py "$RUNNER_TEMP/engine"
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'ubuntu:26.04', 'debian:stable', 'fedora:latest', 'archlinux:latest', 'opensuse/tumbleweed:latest']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the same dependencies as the user installer
        shell: bash
        run: |
          set -euo pipefail
          source scripts/distro-packages.sh
          run() { "$@"; }
          say() { echo "$*"; }
          if [ "$(family)" = arch ]; then pacman -Syu --noconfirm; fi
          install_packages "$(family)"
      - name: Check native development metadata and Python
        shell: bash
        run: |
          pkg-config --exists sdl2 mpv libpulse libavcodec libavformat libavutil libswscale libswresample freetype2 wayland-client dbus-1
          python3 -m venv /tmp/wpe-venv
          /tmp/wpe-venv/bin/python -m pip install -e .
          QT_QPA_PLATFORM=offscreen /tmp/wpe-venv/bin/python -c 'from PySide6.QtWidgets import QApplication; app=QApplication([])'
