[project]
name = "wpe-gui"
version = "0.1.0"
description = "Interface Qt/QML no estilo Windows para o linux-wallpaperengine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.6"]

[project.scripts]
wpe-gui = "wpe_gui.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
wpe_gui = ["qml/*.qml"]
